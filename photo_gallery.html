<!DOCTYPE html>
<html>

<head>
    <title>My photo gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gallery.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Supermercado+One&display=swap"
    rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>

<body>
    <!--Title of the page-->
    <h1 id="heading">My photo gallery</h1>
    <!--carousel componants-->
    <div id="phCarousel" class="carousel slide" data-bs-ride="carousel">
        <ol class="carousel_indicators">
            <li data-bs-target="#phCarousel" data-bs-slide-to="0" class="active"></li>
            <li data-bs-target="#phCarousel" data-bs-slide-to="1"></li>
            <li data-bs-target="#phCarousel" data-bs-slide-to="2"></li>
            <li data-bs-target="#phCarousel" data-bs-slide-to="3"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="photo1.jpeg" alt="Durga pose">
                <!-- <p class="para">This pose represents Durga Devi as she kills demons.</p> -->
            </div>
            <div class="carousel-item active">
                <img src="photo2.jpeg" alt="Parvati pose">
                <!-- <p class="para">This pose represents Parvati Devi giving blessings.</p> -->
            </div>
            <div class="carousel-item active">
                <img src="photo3.jpeg" alt="Little Krishna pose">
                <!-- <p class="para">This pose represents little krishna sitting next to a calf.</p> -->
            </div>
            <div class="carousel-item active">
                <img src="photo4.jpeg" alt="Nataraja pose">
                <!-- <p class="para">This pose represents Lord Shiva, or the God of dance(Natyam).</p> -->
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#phCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#phCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
